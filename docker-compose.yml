services:
  app:
    build:
      context: .
    container_name: chatapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/chatapp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  mongo:
    image: mongo:8
    container_name: chatapp-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads:
