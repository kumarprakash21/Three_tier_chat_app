<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Registration Page -->
    <div id="register-page" class="login-page">

        <div class="login-box">

            <h2>Create Account</h2>

            <input
                type="text"
                id="regUsername"
                placeholder="Username">

            <input
                type="password"
                id="regPassword"
                placeholder="Password">

            <button onclick="register()">
                Register
            </button>

        </div>

    </div>

    <!-- Login Page -->
    <div id="login-page"
         class="login-page"
         style="display:none;">

        <div class="login-box">

            <h2>Login</h2>

            <input
                type="text"
                id="username"
                placeholder="Username">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <button onclick="login()">
                Login
            </button>

        </div>

    </div>

    <!-- Chat Page -->
    <div class="chat-container"
         id="chat-container"
         style="display:none;">

        <div class="header">

            <div class="avatar"></div>

            <div class="header-info">
                <h2>Chat App</h2>
                <span>🟢 Online</span>
            </div>

        </div>

        <div id="messages" class="chat-box">

            <div class="message received">
                Welcome to the Chat App 👋
            </div>

        </div>

        <div class="footer">

            <input
                type="text"
                id="msg"
                placeholder="Type your message..."
                autocomplete="off">

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

     <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>

</body>
</html>
