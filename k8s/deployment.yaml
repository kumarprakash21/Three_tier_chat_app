apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp
  labels:
    app.kubernetes.io/name: chatapp
spec:
  # Keep one replica until Socket.IO state is moved to a shared adapter
  # such as Redis and uploads are moved to shared object storage.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatapp
    spec:
      containers:
        - name: chatapp
          image: prakashgautam1998/chatapp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatapp-secrets
                  key: JWT_SECRET
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: chatapp-secrets
                  key: MONGODB_URI
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: chatapp-uploads
